[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-events"
version = "1.0.0"
description = "Versioned JSON Schema contract for events between the lab scheduler and HCS Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/lab_events"]
