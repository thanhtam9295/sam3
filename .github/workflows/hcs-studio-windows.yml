# HCS Studio (hcs-studio/ folder): tests on Windows and the Windows installer.
name: hcs-studio-windows

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Installer variant: cpu (smaller) or cuda (NVIDIA GPUs)"
        default: cpu
        type: choice
        options: [cpu, cuda]
  push:
    tags: ["hcs-studio-v*"]
    # Work branches: builds only when the commit message contains "[build installer]"
    # (the manual "Run workflow" button needs this file on the default branch).
    branches: ["claude/**"]

defaults:
  run:
    working-directory: hcs-studio
    shell: pwsh

jobs:
  tests:
    if: >-
      github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[build installer]')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install uv
          uv venv --python 3.12 .venv
          uv pip install --python .venv\Scripts\python.exe torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv\Scripts\python.exe -e ".[gui,dev,segmentation,profiling,server,assistant]"
      - name: Lint and type check
        run: |
          .venv\Scripts\ruff.exe check .
          .venv\Scripts\mypy.exe
      - name: Tests (no GUI)
        run: .venv\Scripts\python.exe -m pytest -m "not gui" -q -p no:cacheprovider
      - name: Self-test
        run: .venv\Scripts\hcs-studio.exe selftest

  installer:
    # Built even when Windows tests fail (their results stay visible), but not when skipped.
    if: ${{ !cancelled() && needs.tests.result != 'skipped' }}
    runs-on: windows-latest
    needs: tests
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          python -m pip install uv
          choco install innosetup -y --no-progress
      - name: Build installer
        run: ./packaging/build_windows.ps1 -Variant ${{ inputs.variant || 'cpu' }}
      - name: Install silently and run the self-test from the installed copy
        run: |
          $setup = Get-ChildItem dist\HCS-Studio-*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/CURRENTUSER", "/DIR=$env:RUNNER_TEMP\hcs" -Wait
          & "$env:RUNNER_TEMP\hcs\hcs-studio.exe" selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test of the installed copy failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: hcs-studio-windows-installer
          path: |
            hcs-studio/dist/HCS-Studio-*-setup*
          if-no-files-found: error
      - name: GUI smoke test (needs OpenGL; informative only)
        # The console executable: errors go to the output, not to a dialog that waits for a click.
        # The app's watchdog ends a stuck smoke test after 2 minutes (exit code 4). The hosted
        # runners give napari no OpenGL 2.1 context: exit code 5 = the "graphics" message a user
        # would see; it says nothing about PCs with a graphics driver.
        continue-on-error: true
        timeout-minutes: 5
        env:
          HCS_STUDIO_HOME: ${{ runner.temp }}\hcs-home
        run: |
          & "$env:RUNNER_TEMP\hcs\hcs-studio.exe" gui --smoke-test
          $code = $LASTEXITCODE
          $log = Join-Path $env:HCS_STUDIO_HOME "logs\hcs-studio.log"
          if (Test-Path $log) { Get-Content $log -Tail 20 }
          if ($code -ne 0) { throw "GUI smoke test exit code $code" }
