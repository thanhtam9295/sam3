name: Copilot Setup Steps
# Prepares the GitHub Copilot coding agent's environment with the exact locked
# dependencies. The job name must stay "copilot-setup-steps".
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements/lock/*.txt
      - name: Install locked environment
        run: |
          uv venv -p 3.12 .venv
          uv pip sync --require-hashes requirements/lock/py312-dev.txt
          uv pip install -e . --no-deps
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "AGENT_ID=copilot" >> "$GITHUB_ENV"
      - name: Enable shared git hooks
        run: git config core.hooksPath .githooks
