[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hcs-studio"
dynamic = ["version"]
description = "Desktop image analysis for high-content cellular imaging"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "dask[array]>=2024.1",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "nd2>=0.11",
    "zarr>=2.17",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.8",
    "pyyaml>=6",
    "psfmodels>=0.3",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
    "napari>=0.9",
    "pyqtgraph>=0.13",
]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "scipy-stubs",
]

[project.scripts]
hcs-studio = "hcs_studio.app:main"

[tool.hatch.version]
path = "src/hcs_studio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hcs_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
filterwarnings = ["ignore:.*json_encoders.*"]
markers = ["gui: needs Qt and a display with OpenGL"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # µ and × are intended in scientific text

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["napari.*", "torch.*", "cupy.*", "dask.*", "zarr.*", "skimage.*", "pyqtgraph.*", "psfmodels.*"]
ignore_missing_imports = true
follow_imports = "skip"
