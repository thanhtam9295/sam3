[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hcs-studio"
dynamic = ["version"]
description = "Desktop image analysis for high-content cellular imaging"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "dask[array]>=2024.1",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "nd2>=0.11",
    "zarr>=2.17",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.8",
    "pyyaml>=6",
    "psfmodels>=0.3",
    "pandas>=2.1",
    "pyarrow>=15",
    "mahotas>=1.4",
    "jinja2>=3.1",
    "scikit-learn>=1.3",
    "umap-learn>=0.5.7",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.5",
    "h5py>=3.10",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "jsonschema>=4.26,<5",
    "keyring>=25.7,<26",
    "argon2-cffi>=25.1,<26",
    "httpx>=0.28,<1",
    "lab-events>=1.0,<2",
]

[tool.uv.sources]
# the event contract shared with the lab scheduler lives next to hcs-studio in this repository
lab-events = { path = "../lab_events", editable = true }

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
    "napari>=0.9",
    "pyqtgraph>=0.13",
]
segmentation = [
    "cellpose>=4.2",
]
server = [
    # Server mode (Phase 27; approved 2026-11-24): REST/WebSocket API and PostgreSQL.
    "fastapi>=0.165,<1",
    "uvicorn>=0.54,<1",
    "psycopg[binary]>=3.3,<4",
]
assistant = [
    # Claude lab assistant (Phase 28; approved 2026-11-24). API version 2026-10-21.
    "anthropic>=2.13,<3",
]
profiling = [
    # Cell Painting profiling (Phase 24; approved 2026-11-24). Pull in duckdb, statsmodels.
    "pycytominer==1.7.1",
    "copairs==0.6.0",
]
gpu = [
    # Install the CUDA build that matches your driver, see https://pytorch.org/get-started/
    "torch>=2.2",
]
packaging = [
    "pyinstaller>=6.10",
    "markdown-it-py>=3",
]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "scipy-stubs",
    "pandas-stubs",
]

[project.scripts]
hcs-studio = "hcs_studio.app:main"

[tool.hatch.version]
path = "src/hcs_studio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hcs_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
# a test that runs this long is stuck: dump every thread's stack (diagnoses rare hangs)
faulthandler_timeout = 180
filterwarnings = [
    "ignore:.*json_encoders.*",
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
markers = ["gui: needs Qt and a display with OpenGL"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # µ and × are intended in scientific text


[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults (server/api.py).
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Header", "fastapi.Query"]
[tool.ruff.lint.per-file-ignores]
# methods prose: sentences read better unbroken
"src/hcs_studio/output/methods.py" = ["E501"]
"src/hcs_studio/monitoring/report.py" = ["E501"]  # HTML page template
"src/hcs_studio/qc/report.py" = ["E501"]  # HTML page template
"src/hcs_studio/assays/cell_cycle.py" = ["E501"]  # HTML page template
"src/hcs_studio/assays/foci.py" = ["E501"]  # HTML page template
"src/hcs_studio/assays/apoptosis.py" = ["E501"]  # HTML page template
"src/hcs_studio/assays/translocation.py" = ["E501"]  # HTML page template
"src/hcs_studio/assays/proliferation.py" = ["E501"]  # HTML page template
"src/hcs_studio/assays/spheroids.py" = ["E501"]  # HTML page template
"src/hcs_studio/kinetics/report.py" = ["E501"]  # HTML page template
"src/hcs_studio/screening/report.py" = ["E501"]  # HTML page template
"src/hcs_studio/cellpainting/naming.py" = ["E501"]  # the name mapping table

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "../lab_events/src"]

[[tool.mypy.overrides]]
module = ["napari.*", "torch.*", "cupy.*", "dask.*", "zarr.*", "skimage.*", "pyqtgraph.*", "psfmodels.*", "cellpose.*", "sam3.*", "mahotas.*", "pyarrow.*", "sklearn.*", "joblib.*", "igraph.*", "leidenalg.*", "umap", "umap.*", "matplotlib", "matplotlib.*", "openpyxl", "reportlab", "reportlab.*", "imageio_ffmpeg", "imageio_ffmpeg.*", "openpyxl.*", "h5py", "h5py.*", "jsonschema", "jsonschema.*", "pycytominer", "pycytominer.*", "copairs", "copairs.*"]
ignore_missing_imports = true
follow_imports = "skip"
