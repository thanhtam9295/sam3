# HCS Studio in server mode on one Linux GPU server (Docker Compose + NVIDIA Container Toolkit).
# Copy .env.example to .env, put the certificates in ./certs and the settings (data roots,
# server.results_root) in ./settings/settings.json, then:
#   docker compose up -d --build
# See docs/server.md (deployment, upgrades, backups) and docs/it_security.md.
name: hcs-studio

x-app: &app
  build:
    context: ../..
    dockerfile: hcs-studio/deploy/Dockerfile
  image: hcs-studio:${HCS_VERSION:-latest}
  restart: unless-stopped
  environment:
    HCS_DATABASE_URL: postgresql+psycopg://hcs:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/hcs
    HCS_STUDIO_HOME: /data/settings
  volumes:
    - ./settings:/data/settings
    - ${RAW_DATA:?set RAW_DATA in .env}:/mnt/raw:ro          # the lab file share, read-only
    - ${RESULTS:?set RESULTS in .env}:/mnt/results           # the results share
  depends_on:
    db:
      condition: service_healthy
  networks: [internal]

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hcs
      POSTGRES_DB: hcs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcs -d hcs"]
      interval: 5s
      retries: 20
    networks: [internal]

  api:
    <<: *app
    command: ["hcs-studio", "serve", "--host", "0.0.0.0", "--port", "8000"]

  worker-gpu:
    <<: *app
    command: ["hcs-studio", "worker-pool", "--gpus", "${GPUS:-0}", "--cpu", "0"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all

  worker-cpu:
    <<: *app
    command: ["hcs-studio", "worker-pool", "--cpu", "${CPU_WORKERS:-2}"]

  proxy:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"       # the only port open to the lab network
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro      # institutional certificate and key
    depends_on: [api]
    networks: [internal]

volumes:
  db-data:

networks:
  internal:
